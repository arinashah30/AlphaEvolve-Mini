[project]
name = "alphaevolve-mini"
version = "0.1.0"
description = "Small AlphaEvolve-inspired experiment: LLM-guided heuristic improvement vs independent sampling on 2D online bin packing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "google-genai>=1.0",
]

[project.scripts]
alphaevolve-mini = "alphaevolve_mini.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaevolve_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::SyntaxWarning:google.genai.*"]
